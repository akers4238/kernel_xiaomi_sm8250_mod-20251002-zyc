name: import-zyc-20251002

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 1. 从上游抓取 zyc 分支快照 (90657f2, 含全部 blob)
        run: |
          set -euo pipefail
          git init -q /tmp/src
          cd /tmp/src
          git remote add upstream https://github.com/ApartTUSITU/kernel_xiaomi_sm8250_mod.git
          git fetch -q --depth=1 upstream 90657f20409c64c3fdfeb808905dee8f47b06d53
          git checkout -q FETCH_HEAD
          echo "commit: $(git rev-parse HEAD)"
          echo "tree  : $(git rev-parse 'HEAD^{tree}')"
          git log -1 --format='date : %ci%nmsg  : %s'
          echo "files: $(git ls-tree -r HEAD | wc -l)"        # 中文注释占位
          du -sh /tmp/src

      - name: 2. 生成同 tree 的根提交并推送
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/src
          export GIT_AUTHOR_NAME=import-bot GIT_AUTHOR_EMAIL=import-bot@users.noreply.github.com
          export GIT_COMMITTER_NAME=import-bot GIT_COMMITTER_EMAIL=import-bot@users.noreply.github.com
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "上游 tree: $TREE"
          if [ "$TREE" != "39c91592d7e6dc619062405c30d6ac77a1888783" ]; then
            echo "❌ tree 与预期不符"; exit 1
          fi
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          C=$(git commit-tree "$TREE" -m "Import upstream branch android16-aptusitu-zyc @ 90657f20409c64c3fdfeb808905dee8f47b06d53 (dagu KSU kernel, built 2025-10-02 19:04 CST) -- upstream tree: $TREE")
          git update-ref refs/heads/android16-aptusitu-zyc "$C"
          echo "== 尝试 1: 完整快照(含 .github/workflows) =="
          if git push -f "$URL" refs/heads/android16-aptusitu-zyc; then
            echo "OK 完整推送成功, 提交: $C"; exit 0
          fi
          echo "== 尝试 1 失败, 尝试 2: 剥离 .github/workflows =="
          git update-ref -d refs/heads/android16-aptusitu-zyc
          export GIT_INDEX_FILE=/tmp/idx
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$TREE"
          git rm -rq --cached .github/workflows
          T2=$(git write-tree)
          unset GIT_INDEX_FILE
          C2=$(git commit-tree "$T2" -m "Import upstream branch android16-aptusitu-zyc @ 90657f20409c64c3fdfeb808905dee8f47b06d53 (dagu KSU kernel, built 2025-10-02 19:04 CST); .github/workflows 稍后由手机端补充 -- partial tree: $T2")
          git update-ref refs/heads/android16-aptusitu-zyc "$C2"
          git push -f "$URL" refs/heads/android16-aptusitu-zyc
          echo "OK 已推送(不含 .github/workflows), 提交: $C2"
          echo "局部 tree: $T2"

name: Build dagu Kernel with KSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 相当于 git clone --depth=1，加快速度

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 unzip

    - name: Setup proton-clang toolchain
      run: |
        mkdir -p $HOME/proton-clang/proton-clang-20210522
        cd $HOME/proton-clang/proton-clang-20210522
        wget https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz
        tar -zxvf Clang-13.0.1-20230207.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel for dagu with KSU
      run: |
        bash build.sh dagu ksu

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dagu-ksu-kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
